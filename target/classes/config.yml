#Set to false to have the money stored
#inside RoyaleEconomy
#If you need bungeecord shared economy
#you need to have this set to false.
no-economy: true

#Actions made by admins/console
#will appear as made by this one
server-executor-name: '&7Server Banker'
use-bank-logs: false

#If you have a skyblock plugin that is compatible
#with RoyaleEconomy and you wish to hook to it, make sure
#this is set to true
search-skyblock-hook: true

#Check for other plugins to hook the banks to
#for example SaberFactions:
#ATTENTION! The option search-skyblock-hook and this one can't be true at the same time
other-plugins-hook: false

#How many coins should a player have by default in their purse
default-balance: 0
#How many coins should a player have by default in their bank
default-bank-balance: 0

#Cooldowns in seconds
bank-cooldown: 0
sharedbank-cooldown: 0
bank-cooldown-message: '&cThe bank is in cooldown for %cooldown% seconds.'

#If this is set to true, when a player creates a shared bank
#the personal one will redirect to the shared bank
#The /bank command will be redirected to /sharedbank too
use-only-one-bank: false

#This setting is to enble %royaleeconomy_dynamic_coins% which
#can display coins receiving dynamically (+5) (+100), good for scoreboards/actionbar
use-dynamic-placeholder: true
dynamic-placeholder-format: '&6(+%amount%)'

#More settings for interest at bank upgrades configuration
#Cooldown in hours
interest-cooldown: 31
use-interest: true
interest-online-only: false

number-format:
  use-decimals: false
  short-format:
    #If you set this to true numbers will be shorter
    #1,000,000 -> 1M
    use: false
    units:
      unit1:
        number-of-zeros: 3
        unit-name: 'K'
      unit2:
        number-of-zeros: 6
        unit-name: 'M'
      unit3:
        number-of-zeros: 9
        unit-name: 'G'
      unit4:
        number-of-zeros: 12
        unit-name: 'T'
      unit5:
        number-of-zeros: 15
        unit-name: 'Q'

mysql:
  #The bungeecord option is useless without RoyaleEconomyBungee addon on your BungeeCord
  bungeecord: false
  use-mysql: false
  database: 'RoyaleEconomy'
  host: 'localhost'
  port: 3306
  username: 'root'
  password: 'pass123'
  useSSL: false
  allowPublicKeyRetrieval: false
  #How many seconds should the plugin wait before
  #trying to get the player's balance on server join
  #minimum recommended: 2 seconds
  sync-cooldown-seconds: 2

#For redis you don't need the bungee addon
redis:
  #If you want to sync separate server groups
  #within the same redis server, change this channel's name
  channel: 'RoyaleEconomy'
  use-redis: false
  host: 'localhost'
  port: 6379
  password: '12345'

time-units:
  days: 'Days'
  day: 'Day'
  hours: 'Hours'
  hour: 'Hour'
  minutes: 'Minutes'
  minute: 'Minute'
  seconds: 'Seconds'
  second: 'Second'
  soon: '>1 Minute'
short-time-units:
  day: 'd'
  hour: 'h'
  minute: 'm'
  second: 's'

input-guis:
  #Amount input uses Paper dialogs only (Paper 1.21.7+).
  #Every text below supports & colour codes.
  #Available placeholders:
  #  %player%      - player name
  #  %balance%     - purse (deposit) / bank balance (withdraw)
  #  %limit%       - bank limit (deposit)
  #  %amount%      - amount involved in the transaction (messages only)
  dialog:
    #Shown when the server does not have the Paper Dialog API.
    unsupported-server: '&cThis server does not support Paper dialogs. Please use Paper 1.21.7 or newer.'

    deposit:
      title: '&8Deposit coins'
      #Leave empty to use only the title above.
      external-title: ''
      can-close-with-escape: true
      #Pause the game while the dialog is open (single-player only).
      pause: false
      #CLOSE, NONE or WAIT_FOR_RESPONSE.
      after-action: CLOSE
      #One entry per line in the dialog body.
      body:
        - '&7Available: &6%balance%'
        - '&7Bank limit: &6%limit%'
      input:
        label: '&eAmount'
        #Show the label above the text field.
        label-visible: true
        #Initial text inside the field. Empty means no initial text.
        initial: ''
        #Maximum number of typed characters.
        max-length: 32
        #Width of the input field.
        width: 300
      confirm-button:
        label: '&aConfirm'
        tooltip: '&7Click to deposit the amount.'
        width: 100
      cancel-button:
        label: '&cCancel'
        tooltip: '&7Click to cancel.'
        width: 100
      #Messages use %amount% and the placeholders above.
      success-message: '&fYou have deposited &6%amount% coins &fin your bank!'
      fail-message: '&fYou don''t have &6%amount% coins &fin your purse!'
      invalid-number: '&cPlease enter a valid number.'

    withdraw:
      title: '&8Withdraw coins'
      external-title: ''
      can-close-with-escape: true
      pause: false
      after-action: CLOSE
      body:
        - '&7Available: &6%balance%'
      input:
        label: '&eAmount'
        label-visible: true
        initial: ''
        max-length: 32
        width: 300
      confirm-button:
        label: '&aConfirm'
        tooltip: '&7Click to withdraw the amount.'
        width: 100
      cancel-button:
        label: '&cCancel'
        tooltip: '&7Click to cancel.'
        width: 100
      success-message: '&fYou have withdrawn &6%amount% coins &ffrom your bank!'
      fail-message: '&fYou don''t have &6%amount% coins &fin your bank!'
      invalid-number: '&cPlease enter a valid number.'

