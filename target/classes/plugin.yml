name: RoyaleEconomy
author: qKing12
description: Bank plugin
version: "2.5"
api-version: "1.13"
main: me.qKing12.RoyaleEconomy.RoyaleEconomy
folia-supported: true
load: STARTUP
softdepend: [ProtocolLib, PluginQuery]
loadbefore: [Vault]

commands:
#  recurrency:
