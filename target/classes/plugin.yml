  rec_extend_coins_maximum_value:
    permission: op
    description: For crazy people that need numbers bigger than 10^20
  rec_sqlite_to_mysql:
    permission: op
    description: Transfers from SQLite to MySQL
  rec_mysql_to_sqlite:
    permission: op
    description: Transfers from MySQL to SQLite
  royaleeconomy_export:
    description: Export economy players
    aliases: [rec_export, recexport, royaleeconomyexport]
  royaleeconomyimport_essentials:
    permission: op
    description: Import essentials players
    aliases: [recimport_essentials, recimport_ess]
  royaleeconomyimport_cmi:
    permission: op
    description: Import cmi players
    aliases: [recimport_cmi]
